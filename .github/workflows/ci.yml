# CI (04 §11.2): build + unit tests + import audit for x64-modern, x64-xp, x86-ia32 and x86-sse2, plus the
# x64-analysis (/analyze) build. The x86 flavours also run the ISA audit and the constant-time helper-call
# gate (sd-isacheck) as post-build steps and CTests; their test binaries run under WOW64 on the x64
# runner (Dokany tests skip there). TM-R39: first-party actions only, pinned by commit SHA; read-only token.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.preset }})
    runs-on: ${{ vars.SD_BUILD_RUNNER || 'windows-2022' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [x64-modern, x64-xp, x86-ia32, x86-sse2]
    env:
      SD_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up v141_xp toolset
        if: matrix.preset != 'x64-modern'
        uses: ./.github/actions/setup-xp-toolset

      - name: Configure
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }} "-DSD_BUILD_NUMBER=${{ github.run_number }}"

      # Release and Debug both run the post-build import audit (sd-importcheck) and the sdl10n
      # completeness check; either failure fails the build.
      - name: Build Release
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Build Debug
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }}-debug

      - name: Test Release
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }} --output-junit "${{ github.workspace }}/build/ctest-${{ matrix.preset }}.xml"

      - name: Test Debug
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }}-debug

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/bin/Release/*.exe
            build/${{ matrix.preset }}/bin/Release/*.pdb
            build/ctest-${{ matrix.preset }}.xml
          if-no-files-found: error

  analysis:
    name: analysis (x64-analysis)
    runs-on: ${{ vars.SD_BUILD_RUNNER || 'windows-2022' }}
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        shell: pwsh
        run: cmake --preset x64-analysis

      - name: Build (/analyze, warnings are errors)
        shell: pwsh
        run: cmake --build --preset x64-analysis

      - name: Test
        shell: pwsh
        run: ctest --preset x64-analysis
