# Release pipeline (docs/design/04 §12.3, §11.2; D42, D48, TM-R38, TM-R39).
#
# Two channels, chosen with the workflow_dispatch input `channel`:
#
#   beta (default): public pre-release (D48). build -> package (unsigned artifacts + payload tables) ->
#   check-gates -> sign-beta -> publish-beta. The offline signing sessions of the stable flow are replaced by the
#   job sign-beta: it runs tools/release/package-beta.ps1 with the release-beta seed in the protected `beta-signing`
#   environment (secret RELEASE_BETA_SEED, required reviewer = maintainer; 04 §9.3, docs/dev/release-beta.md).
#   review-pass1 and authenticode may be waived for beta in installer/keys/release-gates.txt (D48); every other
#   gate of §12.3 still applies, and check-gates validates the record before anything is signed or published.
#
#   stable: keeps every gate of §12.3, and signing never runs in CI. The two offline signing sessions (D42) are
#   maintainer steps on the offline machine; the jobs signing-session-1, finalize and signing-session-2 are the
#   approval gates and checklists. The package and finalize jobs fail closed for stable until the stable packaging
#   exists in the repository (docs/dev/m4-notes.md): no stable draft release can come out of this file yet.
#
# Actions: only first-party actions, pinned by commit SHA (TM-R39, same pins as ci.yml). No caches anywhere in
# this file (TM-R39): the pinned Dokany files are downloaded fresh in every job that needs them and verified
# against installer/dokany/dokany.lock; artifacts only move files between the jobs of this one run.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match VERSION, for example 0.1.0)"
        required: true
        type: string
      channel:
        description: "Release channel: beta (public pre-release, D48) or stable"
        required: false
        default: beta
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-gates:
    name: verify version, channel and release gates
    runs-on: ${{ vars.SD_BUILD_RUNNER || 'windows-2022' }}
    timeout-minutes: 15
    env:
      SD_INPUT_VERSION: ${{ inputs.version }}
      SD_INPUT_CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SD_INPUT_CHANNEL -ne 'beta' -and $env:SD_INPUT_CHANNEL -ne 'stable') {
            throw "channel must be beta or stable, got '$env:SD_INPUT_CHANNEL'."
          }
          $fileVersion = (Get-Content -Raw VERSION).Trim()
          if ($fileVersion -ne $env:SD_INPUT_VERSION) {
            throw "VERSION is '$fileVersion' but the input is '$env:SD_INPUT_VERSION'."
          }

  build:
    name: build (${{ matrix.preset }})
    needs: verify-gates
    runs-on: ${{ vars.SD_BUILD_RUNNER || 'windows-2022' }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        preset: [x64-modern, x64-xp, x86-ia32, x86-sse2, arm64, arm32]
    env:
      SD_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up v141_xp toolset
        if: matrix.preset != 'x64-modern' && matrix.preset != 'arm64' && matrix.preset != 'arm32'
        uses: ./.github/actions/setup-xp-toolset

      - name: Configure
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }} "-DSD_BUILD_NUMBER=${{ github.run_number }}"

      - name: Build Release
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test Release
        if: matrix.preset != 'arm64' && matrix.preset != 'arm32'
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }}

      # Reproducible build (04 §12.2): two builds from one source tree compared byte for byte. Two presets only, the
      # rest of the matrix runs the same check when the double build is affordable on the release runner.
      - name: Reproducible build check
        if: matrix.preset == 'x64-modern' || matrix.preset == 'x86-ia32'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-repro.ps1 -Preset ${{ matrix.preset }}

      # Unsigned binaries only: the payload tables are signed in the offline session (D42, stable) or in the
      # protected beta-signing environment (D48, beta), never in the build jobs.
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bin-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/bin/Release/*.exe
            build/${{ matrix.preset }}/bin/Release/*.pdb
          if-no-files-found: error

  # 04 §12.3 step 10 / D48 for beta: the Dokany files are downloaded fresh here (never from a cache, TM-R39) and
  # package-beta.ps1 verifies them against installer/dokany/dokany.lock before embedding any of them. It then
  # produces the unsigned beta artifacts and payload-tables.txt, so the release set exists and is checked before
  # the protected environment is involved. Stable keeps failing closed here until its packaging exists.
  package:
    name: package (payload CABs, MSIs, setup EXEs, tables)
    needs: build
    runs-on: ${{ vars.SD_BUILD_RUNNER || 'windows-2022' }}
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stable packaging is not implemented yet
        if: inputs.channel == 'stable'
        shell: pwsh
        run: |
          throw 'package is not implemented for the stable channel yet: it needs the offline sessions of 04 section 12.3 (docs/dev/m4-notes.md). The stable path stays fail-closed.'

      - name: Download the pinned Dokany files
        if: inputs.channel == 'beta'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = (Select-String -Path installer/dokany/dokany.lock -Pattern '^url-upstream (.+)$').Matches[0].Groups[1].Value.Trim()
          $files = @(Select-String -Path installer/dokany/dokany.lock -Pattern '^file \S+ \S+ (\S+) ').Matches |
            ForEach-Object { $_.Groups[1].Value }
          $files = @($files | Select-Object -Unique)
          if ($files.Count -eq 0) { throw 'no file lines found in installer/dokany/dokany.lock' }
          New-Item -ItemType Directory -Force build/dokany | Out-Null
          foreach ($f in $files) {
            $u = $url + $f
            Write-Host "downloading $u"
            Invoke-WebRequest -Uri $u -OutFile (Join-Path 'build/dokany' $f)
          }

      - name: Package the unsigned beta artifacts
        if: inputs.channel == 'beta'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/package-beta.ps1 `
            -Version '${{ inputs.version }}' -Commit '${{ github.sha }}' -BuildNumber '${{ github.run_number }}' `
            -DokanyDir build/dokany -OutDir dist/beta

      - name: Upload the unsigned beta artifacts
        if: inputs.channel == 'beta'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beta-release-unsigned
          path: dist/beta/*
          if-no-files-found: error

  # 04 §12.3 release gates: sd-release validates installer/keys/release-gates.txt for this version and commit. The
  # record is maintainer-edited and CODEOWNERS-protected; the check reads it and uses no secrets. Refusal fails the job.
  check-gates:
    name: check the release gates record (04 §12.3)
    needs: build
    runs-on: ${{ vars.SD_BUILD_RUNNER || 'windows-2022' }}
    timeout-minutes: 30
    env:
      SD_INPUT_VERSION: ${{ inputs.version }}
      SD_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the sd-release tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset x64-modern
          cmake --build --preset x64-modern --target sd-release

      - name: Check the release gates record
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path build/x64-modern -Recurse -Filter sd-release.exe | Select-Object -First 1
          if ($null -eq $exe) { throw 'sd-release.exe was not built.' }
          & $exe.FullName gates check installer/keys/release-gates.txt --version $env:SD_INPUT_VERSION --commit $env:SD_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "release gates check failed (exit $LASTEXITCODE): see 04 section 12.3." }

  # Beta signing (D48, 04 §9.3): the only step that holds the release-beta seed. The protected beta-signing
  # environment (required reviewer = maintainer) must be approved; the seed arrives as the RELEASE_BETA_SEED
  # secret, is written to a temp file for the packaging script, and is deleted afterwards. It is never printed.
  sign-beta:
    name: sign the beta release (release-beta key)
    needs: [package, check-gates]
    if: inputs.channel == 'beta'
    runs-on: ${{ vars.SD_BUILD_RUNNER || 'windows-2022' }}
    timeout-minutes: 120
    environment: beta-signing
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the pinned Dokany files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = (Select-String -Path installer/dokany/dokany.lock -Pattern '^url-upstream (.+)$').Matches[0].Groups[1].Value.Trim()
          $files = @(Select-String -Path installer/dokany/dokany.lock -Pattern '^file \S+ \S+ (\S+) ').Matches |
            ForEach-Object { $_.Groups[1].Value }
          $files = @($files | Select-Object -Unique)
          if ($files.Count -eq 0) { throw 'no file lines found in installer/dokany/dokany.lock' }
          New-Item -ItemType Directory -Force build/dokany | Out-Null
          foreach ($f in $files) {
            $u = $url + $f
            Write-Host "downloading $u"
            Invoke-WebRequest -Uri $u -OutFile (Join-Path 'build/dokany' $f)
          }

      - name: Write the release-beta seed to a temp file
        shell: pwsh
        env:
          SD_RELEASE_BETA_SEED: ${{ secrets.RELEASE_BETA_SEED }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SD_RELEASE_BETA_SEED)) {
            throw 'RELEASE_BETA_SEED is not configured in the beta-signing environment.'
          }
          $seedFile = Join-Path ([IO.Path]::GetTempPath()) ("sd-release-beta-" + [guid]::NewGuid().ToString('N') + ".seed")
          [IO.File]::WriteAllText($seedFile, $env:SD_RELEASE_BETA_SEED.Trim() + "`n")
          Add-Content -Path $env:GITHUB_ENV -Value "SD_BETA_SEED_FILE=$seedFile"

      - name: Package and sign the beta release
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/package-beta.ps1 `
            -Version '${{ inputs.version }}' -Commit '${{ github.sha }}' -BuildNumber '${{ github.run_number }}' `
            -DokanyDir build/dokany -OutDir dist/beta -Seed $env:SD_BETA_SEED_FILE

      - name: Delete the seed file
        if: always()
        shell: pwsh
        run: |
          if ($env:SD_BETA_SEED_FILE -and (Test-Path $env:SD_BETA_SEED_FILE)) {
            Remove-Item -Force $env:SD_BETA_SEED_FILE
            Write-Host 'the seed file was deleted'
          }

      - name: Upload the signed beta release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beta-release-signed
          path: dist/beta/*
          if-no-files-found: error

  # The only job with contents: write (TM-R39): it fetches the signed set of this run and creates the public
  # pre-release with all files and the notes from package-beta.ps1.
  publish-beta:
    name: publish the beta pre-release
    needs: sign-beta
    if: inputs.channel == 'beta'
    runs-on: ${{ vars.SD_BUILD_RUNNER || 'windows-2022' }}
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    # No environment here: the seed secret of beta-signing is not exposed to this job (it was approved at sign-beta).
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the signed beta release of this run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download ${{ github.run_id }} -n beta-release-signed -D dist/beta
          $files = @(Get-ChildItem dist/beta -File)
          if ($files.Count -lt 6) { throw "the signed release set is incomplete ($($files.Count) files)." }
          foreach ($must in @('SHA256SUMS', 'SHA256SUMS.sig', 'manifest.txt', 'release-notes.md')) {
            if (-not (Test-Path (Join-Path 'dist/beta' $must))) { throw "missing $must in the signed release set" }
          }

      - name: Create the public pre-release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v${{ inputs.version }}-beta"
          $assets = @(Get-ChildItem dist/beta -File | Where-Object { $_.Name -ne 'release-notes.md' } |
            ForEach-Object { $_.FullName })
          gh release create $tag --prerelease --title $tag `
            --notes-file dist/beta/release-notes.md --target ${{ github.sha }} @assets
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)." }

  signing-session-1:
    name: offline signing session 1 of 2 (maintainer, D42)
    needs: [package, check-gates]
    if: inputs.channel == 'stable'
    runs-on: ${{ vars.SD_BUILD_RUNNER || 'windows-2022' }}
    timeout-minutes: 30
    environment: release-stable-session-1
    steps:
      # The maintainer performs this session offline (04 §12.3 step 5): verify payload-tables.txt against the rebuilt
      # payloads with sd-release verify, sign with the release-stable key, and hand the signatures to the finalize step.
      # CI signs nothing here; the key never touches this runner.
      - name: Checklist
        shell: pwsh
        run: |
          Write-Output 'Offline session 1 of 2 (D42): verify payload-tables.txt, sign it on the offline machine, record the result.'

  finalize:
    name: finalize (draft release, manually approved)
    needs: signing-session-1
    if: inputs.channel == 'stable'
    runs-on: ${{ vars.SD_BUILD_RUNNER || 'windows-2022' }}
    timeout-minutes: 60
    # The only stable job with write access: it creates the draft release and nothing else (TM-R39).
    permissions:
      contents: write
    environment: release-finalize
    steps:
      - name: Stop until stable packaging exists
        shell: pwsh
        run: |
          throw 'finalize is not implemented for the stable channel yet: PAYLOAD_SIG insertion, SHA256SUMS, manifest.txt and the draft release need the stable package job first (docs/dev/m4-notes.md).'

  signing-session-2:
    name: offline signing session 2 of 2 (maintainer, D42)
    needs: finalize
    if: inputs.channel == 'stable'
    runs-on: ${{ vars.SD_BUILD_RUNNER || 'windows-2022' }}
    timeout-minutes: 30
    environment: release-stable-session-2
    steps:
      # 04 §12.3 step 7: verify manifest.txt and SHA256SUMS against the draft assets with sd-release verify, sign them
      # with the release-stable key offline, and upload manifest.txt (signed) and SHA256SUMS.sig to the draft.
      - name: Checklist
        shell: pwsh
        run: |
          Write-Output 'Offline session 2 of 2 (D42): verify manifest.txt and SHA256SUMS against the draft, sign offline, upload the signed files.'
